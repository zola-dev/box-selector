<div
  class="option-item clickable-card"
  [class.option-item--selected]="isSelected$ | async"
  (click)="onOptionClick()"
  role="option"
  tabindex="0"
  [attr.aria-selected]="isSelected$ | async"
  (keydown.enter)="onOptionClick()"
>
  <span class="option-item__label">{{ label }}</span>
  <span class="option-item__value">{{ value }}</span>
</div>
