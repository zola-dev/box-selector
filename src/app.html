<div class="app">
  <header class="app__header">
    <h1 class="app__title">Box Selector <span class="app__subtitle">Signals version</span></h1>
    <div class="total-score">Total caffeine: {{ boxState.totalScore() | number: '1.1-1' }} mg</div>
    <button
      class="btn btn--danger"
      (click)="onClearAll()"
      [attr.aria-label]="'Remove all selections'"
    >
      Clear all
    </button>
  </header>

  <main class="app__main">
    <!-- Box grid -->
    <section class="app__boxes">
      <app-box-list />
    </section>

    <!-- Coffee option selector — only visible when a slot is active -->
    <aside class="app__selector">
      @if (selectionUi.hasActiveSlot()) {
        <app-option-selector />
      } @else {
        <p class="app__hint">Click a box to choose a coffee</p>
      }
    </aside>
  </main>
</div>
